<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>联机验证版</title>
  <style>
    *{box-sizing:border-box}body{font-family:system-ui;background:#151923;color:#edf2f7;max-width:1100px;margin:0 auto;padding:24px}
    input,button{padding:9px 11px;margin:3px;background:#252c3c;color:#fff;border:1px solid #48536b;border-radius:4px}
    button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(9,minmax(30px,42px));gap:2px;margin-top:16px}
    .cell{height:42px;background:#d0ad72;color:#18202c;display:flex;align-items:center;justify-content:center;font-weight:bold}.platform-cell{outline:2px solid #50c9b1;outline-offset:-3px}
    .piece-a{background:#b73b43;color:#fff}.piece-b{background:#3d6db5;color:#fff}
    .panel{background:#202636;padding:14px;border-radius:6px;margin:12px 0}.muted{color:#aeb9cc}.hidden{display:none}.host-only-warning{background:#a52d35!important}.dialog{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center}.dialog-box{background:#202636;padding:20px;border-radius:6px;max-width:420px}.dialog.hidden{display:none}
    #chatLog,#gameChatLog{height:150px;overflow:auto;background:#171b24;padding:8px;white-space:pre-wrap}.room-row,.player-row{display:grid;grid-template-columns:minmax(120px,1fr) auto auto;gap:12px;align-items:center;border-top:1px solid #394256;padding:9px 2px}.player-row{grid-template-columns:42px minmax(100px,1fr) auto auto}.room-list{max-height:260px;overflow:auto}.status-online{color:#79d7a2}.status-offline{color:#efad6e}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px}.toolbar input{min-width:150px}.seat-list{margin:10px 0}
    @media(max-width:640px){body{padding:12px}.room-row{grid-template-columns:1fr auto}.room-row span:nth-child(2){grid-column:1}.player-row{grid-template-columns:32px minmax(70px,1fr) auto}.player-row span:last-child{grid-column:2/-1}.grid{width:100%;grid-template-columns:repeat(9,minmax(0,1fr))}.cell{height:auto;aspect-ratio:1;padding:0}}
  </style>
</head>
<body>
  <h1>联机验证版</h1>
  <div class="panel toolbar"><input id="room" value="demo" placeholder="房间号"><input id="roomNameInput" placeholder="房间名称"><input id="name" placeholder="昵称"><select id="ruleset"><option value="classic-validation-0.1">普通联机验证</option><option value="opaque-air-validation-0.1">不透明空战验证（2人）</option></select><button id="createRoom">创建房间</button><button id="joinRoom">输入房间号加入</button><button id="refreshRooms">刷新房间</button><span id="status" class="muted">未连接</span></div>
  <section id="roomBrowser" class="panel"><h2>可加入房间</h2><div id="roomList" class="room-list muted">连接后显示开放房间</div></section>
  <section id="lobby" class="panel hidden">
    <h2>预备大厅</h2><p>房间：<b id="roomName"></b>　房主：<b id="hostName"></b>　状态：<b id="lockStatus"></b></p><div><label for="requiredPlayers">本局参与人数</label><input id="requiredPlayers" type="number" min="2" max="8" value="2"><button id="setRequiredPlayers">确定人数</button></div><p id="playerCountStatus" class="muted"></p><div id="players" class="seat-list"></div>
    <p>房间状态：<b id="lockStatus"></b></p><button id="participate">参与游戏</button><button id="spectate">观战</button><button id="startGame">开始游戏</button><button id="lockRoom">锁定房间</button><button id="unlockRoom">解锁房间</button><button id="leaveLobby">离开房间</button><button id="endRoom">结束房间</button>
    <h3>房间聊天</h3><div id="chatLog"></div><input id="chatInput" placeholder="输入消息"><button id="sendChat">发送</button>
  </section>
  <div id="defeatDialog" class="dialog hidden"><div class="dialog-box"><h2>你失败了</h2><p>你的棋子已经从棋盘清除。</p><button id="watchAfterDefeat">观战</button><button id="returnLobbyAfterDefeat">回到准备窗口</button></div></div>
  <section id="game" class="hidden">
    <div class="panel"><div id="turn"></div><div id="airControls" class="hidden"><h3>空军任务</h3><label>己方飞机 <select id="aircraftSelect"></select></label> <button id="addWaypoint">添加首个航点</button> <label>返回平台 <select id="destinationPad"></select></label> <button id="finishRoute">完成航线</button> <button id="saveRoute">保存航线</button> <button id="launchPlan">确认计划并开启 30 秒反应窗</button><p>首航点须与起飞平台相邻；在棋盘上逐格点选航点，并选择终点平台。</p><label>防空炮/直升机 <select id="airUnitSelect"></select></label> <label>目标坐标 <input id="airTarget" placeholder="x,y" size="8"></label> <button id="queueAirMove">加入移动任务</button> <button id="submitAirTasks">保存空军任务</button> <button id="confirmAir">确认并结束响应</button><p id="airStatus" class="muted"></p></div><div id="grid" class="grid"></div><p id="classicHelp" class="muted">验证版操作：点击己方棋子，再点击相邻目标格，加入一条命令；点击提交后由服务器验证。</p><button id="submit">提交当前命令</button><button id="clear">清除命令</button><button id="leaveGame">离开房间</button><pre id="log"></pre></div>
    <div class="panel"><h3>对局聊天</h3><div id="gameChatLog"></div><input id="gameChatInput" placeholder="输入消息"><button id="sendGameChat">发送</button></div>
  </section>
  <script type="module" src="/client.js"></script>
</body>
</html>
